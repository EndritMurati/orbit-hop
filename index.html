<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bored Arcade</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root { --bg: #07060f; --card: #141127; --edge: #2c2655; --text: #fff1e8; --dim: #7a72a3; --hot: #ffa300; color-scheme: dark; }
body { margin: 0; min-height: 100vh; box-sizing: border-box; padding: 48px 16px; background: radial-gradient(ellipse at 50% 20%, #1b1636, var(--bg) 70%); color: var(--text); font-family: "Press Start 2P", ui-monospace, monospace; display: grid; place-content: center; gap: 28px; text-align: center; }
h1 { margin: 0; font-size: clamp(22px, 6vw, 36px); color: var(--hot); text-shadow: 3px 3px 0 #7e2553; }
p { margin: 0; color: var(--dim); font-size: 10px; line-height: 1.8; }
.games { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); max-width: 560px; }
a { display: grid; gap: 10px; padding: 22px 18px; background: var(--card); border: 2px solid var(--edge); border-radius: 8px; color: var(--text); text-decoration: none; font-size: 14px; }
a span { font-size: 9px; line-height: 1.7; color: var(--dim); }
a:hover, a:focus-visible { border-color: var(--hot); outline: none; transform: translateY(-2px); }
</style>
</head>
<body>
<h1>BORED ARCADE</h1>
<p>Pick a game. Works on desktop and phone.</p>
<div class="games">
  <a href="hornet-storm/">HORNET STORM<span>Retro pixel shooter with diving formations, bosses and chiptune music.</span></a>
  <a href="orbit-hop/">ORBIT HOP<span>One-tap arcade: hop between orbits, dodge debris, grab stars.</span></a>
</div>
</body>
</html>
